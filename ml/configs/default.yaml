# Default training configuration for ParcelAI MultiTask model
model_name: "ParcelAI-MultiTask-v1"
encoder_name: "resnet34"
encoder_weights: "imagenet"
in_channels: 4
landuse_classes: 6
epochs: 30
batch_size: 4
lr: 0.0001
image_size: 512
overlap: 0.25
loss_weights:
  building: 1.0
  road: 1.0
  boundary: 1.0
  landuse: 1.0
device: "cuda"
